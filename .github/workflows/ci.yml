name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go — lint · vet · unit · coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install mockgen + golangci-lint (pinned)
        run: |
          go install go.uber.org/mock/mockgen@v0.6.0
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - name: Generate mocks
        run: go generate ./go/tests/mocks/...
      - name: go vet
        run: go vet ./go/...
      - name: golangci-lint (layer rules + linters)
        run: '"$(go env GOPATH)/bin/golangci-lint" run ./go/...'
      - name: Unit tests + coverage profile
        run: >
          go test ./go/... -race -count=1
          -covermode=atomic -coverpkg=./go/... -coverprofile=cover.out
      - name: Coverage summary
        run: go tool cover -func=cover.out | tail -1

  python:
    name: Python — ruff · basedpyright · unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python/techai_webutils
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Sync
        run: uv sync --all-extras --dev
      - name: ruff
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: basedpyright
        run: uv run basedpyright
      - name: pytest (unit — 90% coverage of the unit surface)
        run: uv run pytest -m "not integration"

  security:
    name: Security — govulncheck · bandit · gitleaks · osv-scanner · trufflehog · trivy · opengrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the full history
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install scanners (pinned release assets, sha256-verified)
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          cd "$RUNNER_TEMP"
          # fetch <org/repo> <tag> <asset> <sha256>
          fetch() {
            curl -fsSLo "$3" "https://github.com/$1/releases/download/$2/$3"
            echo "$4  $3" | sha256sum -c -
          }
          fetch gitleaks/gitleaks v8.30.1 gitleaks_8.30.1_linux_x64.tar.gz \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz -C "$bin" gitleaks
          fetch trufflesecurity/trufflehog v3.97.9 trufflehog_3.97.9_linux_amd64.tar.gz \
            40377e6572495412fb9ba0bc21c9401f73b72f1d2afd11b9931bc4a5ed622866
          tar -xzf trufflehog_3.97.9_linux_amd64.tar.gz -C "$bin" trufflehog
          fetch aquasecurity/trivy v0.74.0 trivy_0.74.0_Linux-64bit.tar.gz \
            2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
          tar -xzf trivy_0.74.0_Linux-64bit.tar.gz -C "$bin" trivy
          fetch google/osv-scanner v2.6.0 osv-scanner_linux_amd64 \
            ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
          install -m 0755 osv-scanner_linux_amd64 "$bin/osv-scanner"
          fetch opengrep/opengrep v1.30.0 opengrep_manylinux_x86 \
            35779bdd72e92129c8df2a77f0c55e8c08356801ea92591ef32108d6b28d564c
          install -m 0755 opengrep_manylinux_x86 "$bin/opengrep"
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          echo "$bin" >> "$GITHUB_PATH"
      - name: govulncheck
        run: '"$(go env GOPATH)/bin/govulncheck" ./go/...'
      - name: bandit
        run: uv tool run bandit==1.9.4 -c bandit.yaml -r python/techai_webutils/src
      - name: gitleaks (full history)
        run: gitleaks git --redact --no-banner
      - name: osv-scanner
        run: osv-scanner scan source -r .
      - name: trufflehog (verified secrets)
        run: trufflehog filesystem . --results=verified --fail --no-update
      - name: trivy (filesystem — vuln + secret, over the tracked tree)
        run: |
          set -euo pipefail
          export_dir="$RUNNER_TEMP/trivy-export"
          mkdir -p "$export_dir"
          git archive HEAD | tar -xf - -C "$export_dir"
          trivy fs --scanners vuln,secret --exit-code 1 --ignorefile .trivyignore.fs "$export_dir"
      - name: opengrep (community + charter + error rules)
        run: opengrep scan --error --config .semgrep/rules .

  integration:
    name: Integration (testcontainers — real Postgres/Redis/MinIO/SQS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install mockgen
        run: go install go.uber.org/mock/mockgen@v0.6.0
      - name: Generate mocks
        run: go generate ./go/tests/mocks/...
      - name: Go integration
        run: go test -tags=integration ./go/... -count=1
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Python integration
        working-directory: python/techai_webutils
        run: uv run pytest -m integration --cov-fail-under=0

  docs:
    name: Docs — markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: markdownlint-cli2 (every *.md, .markdownlint-cli2.jsonc)
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"
