name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (lint · vet · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./go/...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: ./go/...
      - name: go test (unit)
        run: go test ./go/... -race -count=1

  python:
    name: Python (ruff · basedpyright · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python/techai_webutils
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-extras --dev
      - name: ruff
        run: uv run ruff check .
      - name: basedpyright
        run: uv run basedpyright src
      - name: pytest (unit)
        run: uv run pytest -m "not integration"

  scanners:
    name: Security & license (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
      - name: trivy (license + vuln)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scanners: vuln,license
          exit-code: "0"
