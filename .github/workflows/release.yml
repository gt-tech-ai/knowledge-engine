name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  github-release:
    name: GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${{ github.ref_name }}" in *rc*|*alpha*|*beta*) prerelease="--prerelease" ;; esac
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes $prerelease

  pypi:
    name: Publish techai_webutils to PyPI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python/techai_webutils
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      # Publish only a version that is not already on PyPI. The Python version is stamped
      # into pyproject via AutoGitSemVer when the Python package changes; a release that
      # does not bump it (e.g. a Go-only release in this mixed monorepo) is a no-op here
      # rather than a failure. A version-existence check is used instead of
      # `uv publish --check-url` because wheels are not reproducible: an unchanged version
      # rebuilds to a different hash, which --check-url reports as a mismatch error, not a
      # skip.
      - name: Resolve version and check PyPI
        id: check
        run: |
          version="$(uv version --short)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if curl -fsS -o /dev/null "https://pypi.org/pypi/techai-webutils/${version}/json"; then
            echo "techai-webutils ${version} is already on PyPI — skipping publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "techai-webutils ${version} is new — will build and publish."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        if: steps.check.outputs.publish == 'true'
        run: uv build
      - name: Publish
        if: steps.check.outputs.publish == 'true'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish
