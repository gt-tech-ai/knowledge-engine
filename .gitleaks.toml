# gitleaks configuration for knowledge-engine.
#
# Extends gitleaks' default rules. The allowlist only skips build output and
# vendored dependencies, which are not source.

title = "knowledge-engine gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Build output and vendored dependencies"
paths = [
  '''(^|/)dist/''',
  '''(^|/)node_modules/''',
  '''(^|/)\.venv/''',
]
